<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Sermon Steward</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbf8f1; --ink: #1a1a1a; --ink-soft: #4a4a4a; --accent: #c4452f; --accent-deep: #9a3624; --sans: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  main { max-width: 36rem; margin: 0 auto; padding: 72px 24px; }
  h1 { font-size: 2rem; letter-spacing: -0.03em; margin: 0 0 12px; }
  p { color: var(--ink-soft); line-height: 1.55; }
  a { color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn { display: inline-flex; align-items: center; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-secondary { background: #fff; color: var(--ink); border: 1px solid #e6e1d3; }
</style>
</head>
<body>
<main>
  <p>Sermon Steward</p>
  <h1>That page isn’t here.</h1>
  <p>The link may be old, or the page was never published. You can go back to the homepage, try one sermon, or write Chris.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">Back to the homepage</a>
    <a class="btn btn-secondary" href="https://try.sermonsteward.com">Try one sermon</a>
    <a class="btn btn-secondary" href="mailto:chris@sovgracekc.org">Email Chris</a>
  </div>
</main>
</body>
</html>
